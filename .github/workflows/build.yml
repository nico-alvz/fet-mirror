name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cli-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            asset_suffix: windows-x86_64
            archive_ext: zip
            qt_arch: win64_mingw
            qt_tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
            generator: 'MinGW Makefiles'
          - os: macos-latest
            asset_suffix: macos-x86_64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}

      - name: Read version
        shell: bash
        run: echo "FETVER=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Configure (command-line only)
        # Same MinGW-on-Windows workaround as build-gui: src/engine/rules.cpp is
        # shared by both targets and hits MSVC's block-nesting limit (C1061).
        run: cmake -B build ${{ matrix.generator && format('-G "{0}"', matrix.generator) || '' }} -DCMAKE_BUILD_TYPE=Release -DCOMMAND_LINE_ONLY=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/dist/fet-cl-${{ env.FETVER }}"

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd "${{ runner.temp }}/dist"
          tar czf "$GITHUB_WORKSPACE/fet-cl-${{ env.FETVER }}-${{ matrix.asset_suffix }}.tar.gz" "fet-cl-${{ env.FETVER }}"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          cd "${{ runner.temp }}/dist"
          7z a -r "$GITHUB_WORKSPACE/fet-cl-${{ env.FETVER }}-${{ matrix.asset_suffix }}.zip" "fet-cl-${{ env.FETVER }}" || \
          zip -r "$GITHUB_WORKSPACE/fet-cl-${{ env.FETVER }}-${{ matrix.asset_suffix }}.zip" "fet-cl-${{ env.FETVER }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fet-cl-${{ matrix.asset_suffix }}
          path: fet-cl-*.${{ matrix.archive_ext }}
          if-no-files-found: error

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            asset_suffix: windows-x86_64
            archive_ext: zip
            qt_arch: win64_mingw
            qt_tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
            generator: 'MinGW Makefiles'
          - os: macos-latest
            asset_suffix: macos-x86_64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}

      - name: Read version
        shell: bash
        run: echo "FETVER=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Configure
        # MSVC hits "compiler limit: blocks nested too deeply" (C1061) on
        # src/engine/rules.cpp, an upstream file we won't patch since this
        # is meant to be an unmodified mirror; MinGW/GCC has no such limit,
        # so Windows builds use it instead of MSVC.
        run: cmake -B build ${{ matrix.generator && format('-G "{0}"', matrix.generator) || '' }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # -j limited on every OS to avoid the runner OOM-killing the parallel
        # compile of the combined interface mocs_compilation.cpp unit.
        run: cmake --build build --config Release --parallel 2

      - name: Install (bundle Qt deps via qt_generate_deploy_app_script)
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/dist/fet-${{ env.FETVER }}"

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd "${{ runner.temp }}/dist"
          tar czf "$GITHUB_WORKSPACE/fet-${{ env.FETVER }}-${{ matrix.asset_suffix }}.tar.gz" "fet-${{ env.FETVER }}"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          cd "${{ runner.temp }}/dist"
          7z a -r "$GITHUB_WORKSPACE/fet-${{ env.FETVER }}-${{ matrix.asset_suffix }}.zip" "fet-${{ env.FETVER }}" || \
          zip -r "$GITHUB_WORKSPACE/fet-${{ env.FETVER }}-${{ matrix.asset_suffix }}.zip" "fet-${{ env.FETVER }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fet-${{ matrix.asset_suffix }}
          path: fet-*.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    needs: [build-gui, build-cli-only]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload build artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
